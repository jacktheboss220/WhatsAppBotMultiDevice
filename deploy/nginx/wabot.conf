# /etc/nginx/sites-available/wabot.conf
# Initial config — HTTP only. Run `./build.sh ssl` and certbot auto-adds the 443 block + certs.
#
# Setup:
#   sudo cp deploy/nginx/wabot.conf /etc/nginx/sites-available/wabot.conf
#   sudo ln -s /etc/nginx/sites-available/wabot.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   EMAIL=you@example.com ./build.sh ssl   ← certbot rewrites this file with SSL

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream wabot_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name eva.jacktheboss220.com;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Security headers
    add_header X-Frame-Options          SAMEORIGIN          always;
    add_header X-Content-Type-Options   nosniff             always;
    add_header Referrer-Policy          strict-origin-when-cross-origin always;

    # Media uploads via /send + sticker/image commands
    client_max_body_size 50m;

    access_log /var/log/nginx/wabot.access.log;
    error_log  /var/log/nginx/wabot.error.log;

    location / {
        proxy_pass http://wabot_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived sockets — QR/status streams
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
